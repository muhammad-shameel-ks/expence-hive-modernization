name: opencode review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Run opencode review and post comment
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: opencode-go/mimo-v2.5
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          INSTRUCTION=$(echo "$COMMENT_BODY" | sed 's|^[^/]*/oc *||' | sed 's|^[^/]*/opencode *||' | xargs)
          if [ -z "$INSTRUCTION" ]; then
            INSTRUCTION="Review the pull request using the evidence-based rubric below."
          fi

          DIFF=$(gh pr diff "$PR_NUMBER" --repo "$REPO")

          cat > /tmp/prompt.txt <<PROMPT
          $INSTRUCTION

          Here is the diff to review:

          \`\`\`diff
          $DIFF
          \`\`\`

          Review only the supplied diff. Do not invent repository context, assume
          requirements that are not visible in the diff, or report issues in unchanged
          code unless the diff clearly introduces or worsens them.

          Report only concrete, actionable findings that have all of these properties:
          - The behavior is demonstrably possible from the changed code.
          - It affects correctness, security, data integrity, reliability, or a clear
            maintainability contract.
          - The finding is not merely a preference, style nit, speculative future risk,
            or a feature that is explicitly out of scope.
          - You can identify the changed file and line or a precise changed hunk.

          Do not repeat a concern merely because it could be improved. If the diff
          already addresses a concern, treat it as addressed. If evidence is
          insufficient, omit the concern. It is valid and expected to return no findings.

          Use this exact structure:
          VERDICT: PASS or CHANGES_REQUESTED
          SCORE: 0-10, where 10 means no actionable findings
          FINDINGS:
          - [severity: critical|high|medium|low] path:line - concise title
            Evidence: what the changed code does and why it is a real problem.
            Fix: the smallest concrete fix required, if applicable.
          SUMMARY: one sentence

          Use CHANGES_REQUESTED only for a confirmed actionable issue. Use PASS and
          SCORE: 10 when there are no such findings. Do not pad the review to make it
          look thorough. Keep the response under 500 words.

          Do not use any tools. Analyze the diff above and respond with the review.
          PROMPT

          opencode run --model "$MODEL" --format json --pure "$(cat /tmp/prompt.txt)" 2>/dev/null \
            | jq -r 'select(.type == "text") | .part.text // empty' \
            | sed 's/\x1b\[[0-9;]*m//g' \
            > /tmp/review.md

          if [ ! -s /tmp/review.md ]; then
            echo "_No review output generated._" > /tmp/review.md
          fi

          {
            echo "### opencode review"
            echo ""
            cat /tmp/review.md
          } > /tmp/comment.md

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/comment.md
