name: opencode review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Run opencode review and post comment
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: opencode-go/mimo-v2.5
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          INSTRUCTION=$(echo "$COMMENT_BODY" | sed 's|^[^/]*/oc *||' | sed 's|^[^/]*/opencode *||' | xargs)
          if [ -z "$INSTRUCTION" ]; then
            INSTRUCTION="Review this PR thoroughly for code quality, bugs, security issues, and style problems."
          fi

          DIFF=$(gh pr diff "$PR_NUMBER" --repo "$REPO")

          cat > /tmp/prompt.txt <<PROMPT
          $INSTRUCTION

          Here is the diff to review:

          \`\`\`diff
          $DIFF
          \`\`\`

          Provide a concise code review. Focus on:
          - Security vulnerabilities (SQL injection, command injection, hardcoded secrets)
          - Bugs and logic errors
          - Missing error handling
          - Code quality issues

          Do not use any tools. Just analyze the diff above and respond with the review.
          PROMPT

          opencode run --model "$MODEL" --format json --pure "$(cat /tmp/prompt.txt)" 2>/dev/null \
            | jq -r 'select(.type == "text") | .part.text // empty' \
            | sed 's/\x1b\[[0-9;]*m//g' \
            > /tmp/review.md

          if [ ! -s /tmp/review.md ]; then
            echo "_No review output generated._" > /tmp/review.md
          fi

          {
            echo "### opencode review"
            echo ""
            cat /tmp/review.md
          } > /tmp/comment.md

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/comment.md
